name: fork-apk

on:
  workflow_dispatch:
  push:
    branches: ["feat/**", "fix/**", "docs/**"]

# A new push to a branch cancels that branch's run still in progress: only the latest commit is worth testing.
concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Every step that runs Gradle has its own limit (Lint 10 min, the others 15): a Gradle that freezes fails that
    # step, the next ones are skipped, and the diagnostics step runs. A green run takes about 13 minutes, so a freeze
    # in the last step still ends well before the job's 40 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: spotless ratchetFrom("origin/main") diffs against main.
          fetch-depth: 0
          filter: 'blob:none'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # The runner has 4 CPUs and 16 GB. The repository's gradle.properties sizes the daemons for a workstation
      # (Gradle 8 GB, Kotlin 6 GB) and Gradle runs 4 workers, each test task forking 2 JVMs of 2 GB: far above 16 GB.
      # The runner then swaps and is shut down mid-tests with no test failing (runs 37 and 38, different last tests).
      # The user-home gradle.properties overrides the project one for CI only; every step uses the same values, so
      # one Gradle daemon and one Kotlin daemon serve the whole job. Worst case: 5 + 4 + 2 x 2 = 13 GB.
      - name: Limit Gradle memory
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          cat >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Xss2m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC -XX:ReservedCodeCacheSize=256m
          kotlin.native.jvmArgs=-Xmx3g -XX:+UseG1GC
          EOF
          cat "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      # Every Gradle command below runs with -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache
      # (feat/ci-gel): 5 runs out of about 15 (45, 47, 48, 54, 58) froze while configuring, the daemon's main thread
      # waiting forever in TaskPathProjectEvaluator.scheduleProjectsJustInTime (Isolated Projects' parallel
      # configuration), memory and network normal. gradle.properties keeps both for workstations; CI turns them off
      # here only. Both go together: Gradle refuses --no-configuration-cache while Isolated Projects is on.
      # 10 minutes (2.5 when green, run 46): a Gradle that freezes here fails the step instead of using up the job,
      # so the diagnostics step below still runs (run 48 froze in this step after compiling build-logic).
      - name: Lint
        timeout-minutes: 10
        run: ./gradlew spotlessCheck detekt -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      # Right after Lint: compiles the Kotlin of the F-Droid debug app and of every module it depends on (their Android
      # variants: compileAndroidMain for the KMP libraries), without the tests, resources or dexing. A compile error
      # in a module no earlier step compiles for Android (feature:map-maplibre, run 52) then fails here in a few
      # minutes instead of at the APK step, after the tests. The APK step reuses these outputs (up to date).
      - name: Compile (Kotlin, fdroid debug)
        timeout-minutes: 15
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew :androidApp:compileFdroidDebugKotlin -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      # Android and JVM tests only: NetworkTact ships on Android. allTests also compiled every module for iOS (its iOS
      # tests were always SKIPPED on Linux), so an iOS-only compile error blocked the APK; ios-check.yml compiles iOS
      # on its own instead. Per module: jvmTest (commonTest and jvmTest sources) everywhere, plus testAndroidHostTest
      # (commonTest and androidHostTest under Robolectric) where the module declares withHostTest.
      - name: Tests
        timeout-minutes: 15
        run: |
          # A fresh Gradle daemon for each step: a daemon reused after the Robolectric host tests froze while
          # configuring the next build (runs 45 and 47, no task started). The Kotlin daemon goes too.
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew --init-script .github/ci/test-started.init.gradle.kts \
            :feature:messaging:jvmTest \
            :feature:node:jvmTest :feature:node:testAndroidHostTest \
            :feature:settings:jvmTest \
            :core:model:jvmTest :core:model:testAndroidHostTest \
            :core:prefs:jvmTest :core:prefs:testAndroidHostTest \
            :core:service:jvmTest :core:service:testAndroidHostTest \
            -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      # Own step, after the others: run in the same invocation, its JVM and Kotlin/Native compilations overlapped the
      # Robolectric host tests and froze the runner (runs 28 and 33).
      # core:navigation stays out of fork-apk: its tests brought the runner down before (rule since task 4).
      - name: Tests core:demo
        timeout-minutes: 15
        run: |
          # A fresh Gradle daemon for each step: a daemon reused after the Robolectric host tests froze while
          # configuring the next build (runs 45 and 47, no task started). The Kotlin daemon goes too.
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew --init-script .github/ci/test-started.init.gradle.kts :core:demo:jvmTest \
            -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      # Own step too: feature:map carries the shared-point dialog test (feat/fait-observe-carte).
      - name: Tests feature:map
        timeout-minutes: 15
        run: |
          # A fresh Gradle daemon for each step: a daemon reused after the Robolectric host tests froze while
          # configuring the next build (runs 45 and 47, no task started). The Kotlin daemon goes too.
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew --init-script .github/ci/test-started.init.gradle.kts :feature:map:jvmTest \
            :feature:map:testAndroidHostTest -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      - name: APK fdroid debug
        timeout-minutes: 15
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew :androidApp:assembleFdroidDebug -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: apk-fdroid-debug
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
      # Last, after the APK is uploaded: feature:map-maplibre carries the map's own tests (basemap choice, chip tags,
      # position times; feat/carte-hors-ligne) next to its Compose UI tests, and the heaviest step should not cost
      # the APK if it strains the runner.
      - name: Tests feature:map-maplibre
        timeout-minutes: 15
        run: |
          # A fresh Gradle daemon for each step: a daemon reused after the Robolectric host tests froze while
          # configuring the next build (runs 45 and 47, no task started). The Kotlin daemon goes too.
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew --init-script .github/ci/test-started.init.gradle.kts :feature:map-maplibre:jvmTest \
            :feature:map-maplibre:testAndroidHostTest -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      # The release APK (fdroidRelease: R8, no debug flags, the baseline profile of androidApp). Last, so that a failure
      # here costs neither the debug APK nor the test results above. Signed with the project's own key when the four
      # NT_* secrets exist; unsigned otherwise (a fork, whose secrets are empty), without failing the run.
      # The key goes to a temporary file outside the repository and keystore.properties is written for this run only
      # (both are git-ignored or outside the tree, and removed below). Nothing here prints a secret: no `set -x`, and
      # GitHub masks secret values in the logs.
      - name: APK fdroid release
        id: release
        timeout-minutes: 30
        env:
          NT_KEYSTORE_BASE64: ${{ secrets.NT_KEYSTORE_BASE64 }}
          NT_KEYSTORE_PASSWORD: ${{ secrets.NT_KEYSTORE_PASSWORD }}
          NT_KEY_PASSWORD: ${{ secrets.NT_KEY_PASSWORD }}
          NT_KEY_ALIAS: ${{ secrets.NT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$NT_KEYSTORE_BASE64" ] && [ -n "$NT_KEYSTORE_PASSWORD" ] && [ -n "$NT_KEY_PASSWORD" ] && [ -n "$NT_KEY_ALIAS" ]; then
            keystore="$RUNNER_TEMP/networktact-release.p12"
            printf '%s' "$NT_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            # Fails here, with a clear message, if the file or the password or the alias is wrong.
            keytool -list -keystore "$keystore" -storetype PKCS12 -storepass:env NT_KEYSTORE_PASSWORD \
              -alias "$NT_KEY_ALIAS" > /dev/null
            # .properties syntax: a backslash in a value has to be doubled.
            escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
            {
              echo "storeFile=$(escape "$keystore")"
              echo "storePassword=$(escape "$NT_KEYSTORE_PASSWORD")"
              echo "keyAlias=$(escape "$NT_KEY_ALIAS")"
              echo "keyPassword=$(escape "$NT_KEY_PASSWORD")"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NT_KEYSTORE_BASE64, NT_KEYSTORE_PASSWORD, NT_KEY_PASSWORD or NT_KEY_ALIAS is empty: building the release APK unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          ./gradlew :androidApp:assembleFdroidRelease -Dorg.gradle.unsafe.isolated-projects=false --no-configuration-cache --stacktrace
      - name: Check the release APK
        timeout-minutes: 5
        env:
          SIGNED: ${{ steps.release.outputs.signed }}
        run: |
          set -euo pipefail
          apk=$(ls androidApp/build/outputs/apk/fdroid/release/*.apk | head -n 1)
          echo "APK: $apk ($(stat -c %s "$apk") bytes)"
          # The startup profile (baseline.prof and baseline.profm) must be packaged: it comes from the googleRelease profile.
          unzip -l "$apk" | grep -E 'assets/dexopt/baseline\.prof' || echo "::warning::no baseline profile in the release APK"
          if [ "$SIGNED" = "true" ]; then
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
            # Public information (the certificate), useful to compare with the key of the project's holder.
            "$apksigner" verify --print-certs "$apk"
          else
            echo "Unsigned APK: not installable until it is signed."
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: apk-fdroid-release
          path: androidApp/build/outputs/apk/fdroid/release/*.apk
      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/networktact-release.p12"
      # When a step failed, timed out or the job was cancelled (a job time-out is a cancellation, not a failure: run
      # 48 skipped this step): what the machine and the Gradle daemons were doing, to tell a daemon short of memory
      # (garbage collection taking the whole time) from one waiting on the network (open connections, a thread
      # blocked in a socket read) or on a lock. Thread dumps are printed in full: the Gradle daemon's build thread
      # ("Daemon worker") can sit past the first hundred lines.
      - name: Diagnostics after a failure
        if: failure() || cancelled()
        timeout-minutes: 5
        run: |
          free -m || true
          jps -lv || true
          ss -tnp || true
          for pid in $(jps -q 2>/dev/null); do
            echo "=== JVM $pid"; jcmd "$pid" GC.heap_info || true; jstat -gcutil "$pid" || true
            jcmd "$pid" Thread.print 2>/dev/null || true
          done
          for log in "${GRADLE_USER_HOME:-$HOME/.gradle}"/daemon/*/daemon-*.out.log; do
            [ -f "$log" ] && { echo "=== $log"; tail -n 80 "$log"; }
          done
