name: fork-apk

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK fdroid debug
        run: ./gradlew :androidApp:assembleFdroidDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-fdroid-debug
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
