name: fork-apk

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]

# A new push to a branch cancels that branch's run still in progress: only the latest commit is worth testing.
concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: spotless ratchetFrom("origin/main") diffs against main.
          fetch-depth: 0
          filter: 'blob:none'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew spotlessCheck detekt --stacktrace
      # allTests = jvmTest (Compose UI tests from commonTest, and node's jvmTest) + testAndroidHostTest where enabled.
      - name: Tests
        run: >-
          ./gradlew --init-script .github/ci/test-started.init.gradle.kts :feature:messaging:allTests :feature:node:allTests
          :feature:settings:allTests :core:model:allTests :core:prefs:allTests :core:service:allTests
          --stacktrace
      # Own step, after the others: run in the same invocation, its JVM and Kotlin/Native compilations overlapped the
      # Robolectric host tests and froze the runner (runs 28 and 33).
      # core:navigation is light (no Robolectric): it carries the demo's tab reset test.
      - name: Tests core:demo
        run: >-
          ./gradlew --init-script .github/ci/test-started.init.gradle.kts :core:demo:allTests :core:navigation:allTests
          --stacktrace
      - name: APK fdroid debug
        run: ./gradlew :androidApp:assembleFdroidDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-fdroid-debug
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
