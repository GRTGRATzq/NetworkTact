name: ios-check

# NetworkTact ships on Android only. The iOS targets stay declared (build-logic) so an iOS version remains possible;
# this workflow keeps an eye on them without ever blocking fork-apk or the APK: it runs by hand and once a week, never
# on a push, and fork-apk does not depend on it. It compiles every module's iOS code (main and tests) and lists every
# error (--continue), then fails so the error is visible in the Actions tab.
#
# The weekly schedule only fires from the repository's default branch; until this file is there, start it by hand
# (Actions → ios-check → Run workflow, choosing the branch).

on:
  workflow_dispatch:
  schedule:
    # Mondays at 04:17 UTC.
    - cron: "17 4 * * 1"

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Same limits as fork-apk: the runner has 16 GB, and Kotlin/Native compilations are memory-hungry.
      - name: Limit Gradle memory
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          cat >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Xss2m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC -XX:ReservedCodeCacheSize=256m
          kotlin.native.jvmArgs=-Xmx3g -XX:+UseG1GC
          EOF
      # Kotlin/Native compiles iOS code to klibs on Linux; linking and running iOS tests needs macOS and is not
      # attempted. A task name without a project path runs in every module that has it.
      - name: Compile iOS targets
        run: >-
          ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileTestKotlinIosSimulatorArm64
          --continue --stacktrace
